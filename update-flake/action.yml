name: "Update flake.lock"
description: >-
  Bump flake.lock and open a PR (optionally auto-merged). Runs as a step inside
  your job; the job needs `permissions: contents: write` and `pull-requests: write`.

inputs:
  base-branch:
    description: "Branch to update against (main/master)."
    required: false
    default: "main"
  token-owner:
    description: "Org for the GitHub App token. Empty falls back to the default GITHUB_TOKEN."
    required: false
    default: ""
  client-id:
    description: >-
      GitHub App Client ID. Preferred over app-id. Required when token-owner is
      set (unless app-id is given).
    required: false
    default: ""
  app-id:
    description: >-
      GitHub App ID. Deprecated: pass client-id instead. Used only when
      token-owner is set and client-id is empty.
    required: false
    default: ""
  app-private-key:
    description: "GitHub App private key. Required when token-owner is set."
    required: false
    default: ""
  install-nix:
    description: '"true" to install Nix (hosted runners). "false" for self-hosted with Nix.'
    required: false
    default: "false"
  nix-version:
    description: >-
      Nix version to install when install-nix is "true". It must be one of the
      versions the pinned nix-quick-install-action release ships; the default
      tracks that release's own default.
    required: false
    default: "2.29.2"
  checkout:
    description: '"true" to checkout the repo first. Set "false" if the job already did.'
    required: false
    default: "true"
  reviewers:
    description: "Comma-separated PR reviewers."
    required: false
    default: ""
  pr-labels:
    description: "Newline-separated PR labels."
    required: false
    default: |
      dependencies
      automated
  pr-title:
    description: "Title of the PR, and the flake.lock commit summary."
    required: false
    default: "Update flake.lock"
  pr-branch:
    description: "Head branch the action pushes the update PR to."
    required: false
    default: "update_flake_lock_action"
  auto-merge:
    description: '"true" to enable PR auto-merge after creation.'
    required: false
    default: "true"
  merge-method:
    description: "Auto-merge method: rebase | merge | squash."
    required: false
    default: "rebase"
  post-run:
    description: >-
      Command to run after `nix flake update` (e.g. regenerate lock-derived
      files like Cargo.nix). Runs against the updated flake; its file changes are
      picked up into the update PR commit. When set with token-owner, the App
      token is re-minted after it so a long post-run can't expire the token
      before the PR is opened. Empty skips it.
    required: false
    default: ""
  export-devshell:
    description: >-
      "true" to load a dev shell into the environment before `post-run`, so the
      command runs inside it (env-export via nicknovitski/nix-develop). The shell
      is `devshell`, defaulting to the flake's default dev shell. "false" runs
      `post-run` in a plain bash shell.
    required: false
    default: "false"
  devshell:
    description: >-
      Installable for the dev shell (e.g. '.#ci') loaded when export-devshell is
      "true". Empty uses the flake's default dev shell.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Generate GitHub App token (client-id)
      id: app-token-client
      if: inputs.token-owner != '' && inputs.client-id != ''
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.token-owner }}

    - name: Generate GitHub App token (app-id, deprecated)
      id: app-token-legacy
      if: inputs.token-owner != '' && inputs.client-id == '' && inputs.app-id != ''
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.token-owner }}

    - name: Resolve GitHub App token
      id: app-token
      if: inputs.token-owner != ''
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token-client.outputs.token || steps.app-token-legacy.outputs.token }}
      run: echo "token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"

    - name: Checkout
      if: inputs.checkout == 'true'
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.base-branch }}
        fetch-depth: 0

    # See the root action.yml: nix-quick-install-action cannot retry a truncated
    # download, so the archive is fetched and checked here first.
    - name: Pre-fetch the Nix archive
      id: nix-archive
      if: inputs.install-nix == 'true'
      shell: bash
      env:
        # This tag must match the nix-quick-install-action pin below; the test
        # suite fails if the two drift.
        NIX_QUICK_INSTALL_RELEASE: v34
        NIX_VERSION: ${{ inputs.nix-version }}
        DEST_DIR: ${{ runner.temp }}/nix-archives
      run: "$GITHUB_ACTION_PATH/../scripts/prefetch-nix-archive.sh"

    - name: Install Nix
      if: inputs.install-nix == 'true'
      uses: nixbuild/nix-quick-install-action@v34
      with:
        nix_version: ${{ inputs.nix-version }}
        nix_archives_url: file://${{ steps.nix-archive.outputs.dir }}

    - name: Update flake.lock
      id: update
      shell: bash
      env:
        PR_TITLE: ${{ inputs.pr-title }}
        NIX_CONFIG: |
          access-tokens = github.com=${{ steps.app-token.outputs.token || github.token }}
          accept-flake-config = true
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        tip="$(git rev-parse HEAD)"
        nix flake update --commit-lock-file \
          --commit-lock-file-summary "$PR_TITLE"
        if [ "$tip" != "$(git rev-parse HEAD)" ]; then
          # Grab Nix's per-input changelog from its commit, then unwind it so
          # create-pull-request makes the real commit/branch/author.
          {
            echo "updated=true"
            echo "body<<__NIX_BODY_EOF__"
            git log -1 --format=%b
            echo "__NIX_BODY_EOF__"
          } >> "$GITHUB_OUTPUT"
          git reset --soft "$tip"
        fi

    - name: Load dev shell into environment
      if: inputs.post-run != '' && inputs.export-devshell == 'true'
      uses: nicknovitski/nix-develop@v1
      with:
        arguments: ${{ inputs.devshell }}
      env:
        NIX_CONFIG: |
          access-tokens = github.com=${{ steps.app-token.outputs.token || github.token }}
          accept-flake-config = true

    - name: Post-run
      if: inputs.post-run != ''
      shell: bash
      env:
        NIX_ACTION_POST_RUN: ${{ inputs.post-run }}
        NIX_CONFIG: |
          access-tokens = github.com=${{ steps.app-token.outputs.token || github.token }}
          accept-flake-config = true
      run: bash -c "$NIX_ACTION_POST_RUN"

    # A post-run may take longer than the App token's 60-minute lifetime, which
    # would expire it before the PR is opened. Re-mint right before the PR so the
    # action is correct by default, with no flag for the user to remember.
    - name: Re-mint GitHub App token (client-id)
      id: app-token-remint-client
      if: inputs.post-run != '' && inputs.token-owner != '' && inputs.client-id != '' && steps.update.outputs.updated == 'true'
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.token-owner }}

    - name: Re-mint GitHub App token (app-id, deprecated)
      id: app-token-remint-legacy
      if: inputs.post-run != '' && inputs.token-owner != '' && inputs.client-id == '' && inputs.app-id != '' && steps.update.outputs.updated == 'true'
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.token-owner }}

    - name: Create PR
      id: create-pr
      if: steps.update.outputs.updated == 'true'
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ steps.app-token-remint-client.outputs.token || steps.app-token-remint-legacy.outputs.token || steps.app-token.outputs.token || github.token }}
        committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
        author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
        base: ${{ inputs.base-branch }}
        branch: ${{ inputs.pr-branch }}
        delete-branch: true
        title: ${{ inputs.pr-title }}
        commit-message: |
          ${{ inputs.pr-title }}

          ${{ steps.update.outputs.body }}
        body: ${{ steps.update.outputs.body }}
        labels: ${{ inputs.pr-labels }}
        reviewers: ${{ inputs.reviewers }}

    - name: Auto merge
      if: inputs.auto-merge == 'true' && steps.create-pr.outputs.pull-request-number != ''
      shell: bash
      run: gh pr merge --auto --${{ inputs.merge-method }} ${{ steps.create-pr.outputs.pull-request-number }}
      env:
        GH_TOKEN: ${{ steps.app-token-remint-client.outputs.token || steps.app-token-remint-legacy.outputs.token || steps.app-token.outputs.token || github.token }}
