name: "Update flake.lock"
description: >-
  Bump flake.lock and open a PR (optionally auto-merged). Runs as a step inside
  your job; the job needs `permissions: contents: write` and `pull-requests: write`.

inputs:
  base-branch:
    description: "Branch to update against (main/master)."
    required: false
    default: "main"
  token-owner:
    description: "Org for the GitHub App token. Empty falls back to the default GITHUB_TOKEN."
    required: false
    default: ""
  client-id:
    description: >-
      GitHub App Client ID. Preferred over app-id. Required when token-owner is
      set (unless app-id is given).
    required: false
    default: ""
  app-id:
    description: >-
      GitHub App ID. Deprecated: pass client-id instead. Used only when
      token-owner is set and client-id is empty.
    required: false
    default: ""
  app-private-key:
    description: "GitHub App private key. Required when token-owner is set."
    required: false
    default: ""
  install-nix:
    description: '"true" to install Nix (hosted runners). "false" for self-hosted with Nix.'
    required: false
    default: "false"
  checkout:
    description: '"true" to checkout the repo first. Set "false" if the job already did.'
    required: false
    default: "true"
  reviewers:
    description: "Comma-separated PR reviewers."
    required: false
    default: ""
  pr-labels:
    description: "Newline-separated PR labels."
    required: false
    default: |
      dependencies
      automated
  pr-title:
    description: "Title of the PR, and the flake.lock commit summary."
    required: false
    default: "Update flake.lock"
  pr-branch:
    description: "Head branch the action pushes the update PR to."
    required: false
    default: "update_flake_lock_action"
  auto-merge:
    description: '"true" to enable PR auto-merge after creation.'
    required: false
    default: "true"
  merge-method:
    description: "Auto-merge method: rebase | merge | squash."
    required: false
    default: "rebase"

runs:
  using: "composite"
  steps:
    - name: Generate GitHub App token (client-id)
      id: app-token-client
      if: inputs.token-owner != '' && inputs.client-id != ''
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.token-owner }}

    - name: Generate GitHub App token (app-id, deprecated)
      id: app-token-legacy
      if: inputs.token-owner != '' && inputs.client-id == '' && inputs.app-id != ''
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.token-owner }}

    - name: Resolve GitHub App token
      id: app-token
      if: inputs.token-owner != ''
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token-client.outputs.token || steps.app-token-legacy.outputs.token }}
      run: echo "token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"

    - name: Checkout
      if: inputs.checkout == 'true'
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.base-branch }}
        fetch-depth: 0

    - name: Install Nix
      if: inputs.install-nix == 'true'
      uses: nixbuild/nix-quick-install-action@v34

    - name: Update flake.lock
      id: update
      shell: bash
      env:
        PR_TITLE: ${{ inputs.pr-title }}
        NIX_CONFIG: |
          access-tokens = github.com=${{ steps.app-token.outputs.token || github.token }}
          accept-flake-config = true
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        tip="$(git rev-parse HEAD)"
        nix flake update --commit-lock-file \
          --commit-lock-file-summary "$PR_TITLE"
        if [ "$tip" != "$(git rev-parse HEAD)" ]; then
          # Grab Nix's per-input changelog from its commit, then unwind it so
          # create-pull-request makes the real commit/branch/author.
          {
            echo "updated=true"
            echo "body<<__NIX_BODY_EOF__"
            git log -1 --format=%b
            echo "__NIX_BODY_EOF__"
          } >> "$GITHUB_OUTPUT"
          git reset --soft "$tip"
        fi

    - name: Create PR
      id: create-pr
      if: steps.update.outputs.updated == 'true'
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ steps.app-token.outputs.token || github.token }}
        base: ${{ inputs.base-branch }}
        branch: ${{ inputs.pr-branch }}
        delete-branch: true
        title: ${{ inputs.pr-title }}
        commit-message: |
          ${{ inputs.pr-title }}

          ${{ steps.update.outputs.body }}
        body: ${{ steps.update.outputs.body }}
        labels: ${{ inputs.pr-labels }}
        reviewers: ${{ inputs.reviewers }}

    - name: Auto merge
      if: inputs.auto-merge == 'true' && steps.create-pr.outputs.pull-request-number != ''
      shell: bash
      run: gh pr merge --auto --${{ inputs.merge-method }} ${{ steps.create-pr.outputs.pull-request-number }}
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
