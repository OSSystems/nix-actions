# CI that runs `nix flake check` and then builds explicit attributes.
# List the installables to build directly in `build-attrs`.
name: CI
on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  ci:
    runs-on: self-hosted
    steps:
      - uses: ossystems/nix-actions@v1
        with:
          token-owner: my-org   # org for the GitHub App token
          client-id: ${{ secrets.RUNNER_CLIENT_ID }}
          app-private-key: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}
          build-attrs: ".#my-package .#nixosConfigurations.my-host.config.system.build.toplevel"
