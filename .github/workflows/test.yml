name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Installs no Nix on purpose: it covers the pre-fetch that protects the
  # install, so it still reports when the Nix download itself is broken.
  prefetch:
    name: prefetch-nix-archive unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./tests/prefetch-nix-archive.test.sh

  # A non-default version proves the pre-fetched archive is the installed one:
  # a wrong name or a skipped hand-off shows up as the default Nix instead.
  nix-version:
    name: nix-version drives the pre-fetch and the install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          checkout: false
          install-nix: true
          nix-version: "2.28.5"
          flake-check: false
          build-hosts: false
          build-devshells: false
          build-packages: false
      - name: Assert the requested Nix is the installed Nix
        run: nix --version | grep -F "2.28.5"

  explicit:
    name: explicit build-attrs + inline flags + run-in-devshell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          checkout: false
          install-nix: true
          build-hosts: false
          build-devshells: false
          build-packages: false
          build-attrs: ".#packages.x86_64-linux.pkgA .#packages.x86_64-linux.pkgB -o result-pkg"
          devshell: ".#ci"
          run: jq --version
      - name: Assert the inline -o flag produced its link
        run: test -e result-pkg

  generated:
    name: build-hosts + build-devshells + checks + empty-platform safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          checkout: false
          install-nix: true
          emulate-systems: i686-linux
          checks: true

  matrix:
    name: matrix + checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          checkout: false
          install-nix: true
          flake-check: false
          build-hosts: false
          build-devshells: false
          build-packages: false
          build-attrs: matrix
          checks: true

  export-devshell:
    name: export-devshell env-export into later steps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert the shell is not loaded yet
        run: |
          if command -v hello >/dev/null; then echo "hello leaked before export" && exit 1; fi
          if [ -n "${NIX_ACTION_DEVELOP_SENTINEL:-}" ]; then echo "env leaked before export" && exit 1; fi
      - uses: ./
        with:
          checkout: false
          install-nix: true
          export-devshell: true
          devshell: ".#ci"
      - name: Assert PATH from the dev shell reached this later step
        run: hello --version
      - name: Assert env vars from the dev shell reached this later step
        run: test "$NIX_ACTION_DEVELOP_SENTINEL" = loaded
