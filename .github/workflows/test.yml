name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Installs no Nix on purpose: it covers the pre-fetch that protects the
  # install, so it still reports when the Nix download itself is broken.
  prefetch:
    name: prefetch-nix-archive unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./tests/prefetch-nix-archive.test.sh

  # A non-default version proves the pre-fetched archive is the installed one:
  # a wrong name or a skipped hand-off shows up as the default Nix instead.
  nix-version:
    name: nix-version drives the pre-fetch and the install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          checkout: false
          install-nix: true
          nix-version: "2.28.7"
          flake-check: false
          build-hosts: false
          build-devshells: false
          build-packages: false
      - name: Assert the requested Nix is the installed Nix
        run: nix --version | grep -F "2.28.7"

  explicit:
    name: explicit build-attrs + inline flags + run-in-devshell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          checkout: false
          install-nix: true
          build-hosts: false
          build-devshells: false
          build-packages: false
          build-attrs: ".#packages.x86_64-linux.pkgA .#packages.x86_64-linux.pkgB -o result-pkg"
          devshell: ".#ci"
          run: jq --version
      - name: Assert the inline -o flag produced its link
        run: test -e result-pkg

  generated:
    name: build-hosts + build-devshells + checks + empty-platform safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          checkout: false
          install-nix: true
          emulate-systems: i686-linux
          checks: true

  matrix:
    name: matrix + checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          checkout: false
          install-nix: true
          flake-check: false
          build-hosts: false
          build-devshells: false
          build-packages: false
          build-attrs: matrix
          checks: true

  export-devshell:
    name: export-devshell env-export into later steps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert the shell is not loaded yet
        run: |
          if command -v hello >/dev/null; then echo "hello leaked before export" && exit 1; fi
          if [ -n "${NIX_ACTION_DEVELOP_SENTINEL:-}" ]; then echo "env leaked before export" && exit 1; fi
      - uses: ./
        with:
          checkout: false
          install-nix: true
          export-devshell: true
          devshell: ".#ci"
      - name: Assert PATH from the dev shell reached this later step
        run: hello --version
      - name: Assert env vars from the dev shell reached this later step
        run: test "$NIX_ACTION_DEVELOP_SENTINEL" = loaded

  # Each run caches under keys of its own, so cache-verify can tell a saved
  # cache from a skipped one. The saving cell is the control: without it, "no
  # cache under this key" would also pass if nothing were ever saved.
  cache:
    name: cache-key-suffix + cache-save=${{ matrix.save }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        save: [true, false]
    steps:
      - uses: actions/checkout@v7
      - id: nix
        uses: ./
        with:
          checkout: false
          install-nix: true
          flake-check: false
          build-hosts: false
          build-devshells: false
          build-packages: false
          cache-key-suffix: -test-${{ matrix.save }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-save: ${{ matrix.save }}
      - name: Assert the suffix ends the primary key
        env:
          KEY: ${{ steps.nix.outputs.cache-primary-key }}
          WANT: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}-test-${{ matrix.save }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ "$KEY" != "$WANT" ]; then
            echo "primary key is '$KEY', want '$WANT'"
            exit 1
          fi

  cache-verify:
    name: cache-save=false saves no cache, cache-save=true does
    needs: cache
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Name the keys the cache job used
        run: |
          base="nix-${{ runner.os }}-${{ hashFiles('flake.*') }}-test"
          run="${{ github.run_id }}-${{ github.run_attempt }}"
          echo "SAVED_KEY=$base-true-$run" >> "$GITHUB_ENV"
          echo "SKIPPED_KEY=$base-false-$run" >> "$GITHUB_ENV"
      - name: Assert cache-save=true saved its cache
        run: |
          gh cache list --key "$SAVED_KEY" --json key --jq '.[].key' | grep -Fx -- "$SAVED_KEY" \
            || { echo "no cache saved under $SAVED_KEY"; exit 1; }
      - name: Assert cache-save=false saved nothing
        run: |
          if gh cache list --key "$SKIPPED_KEY" --json key --jq '.[].key' | grep -Fx -- "$SKIPPED_KEY"; then
            echo "a cache was saved under $SKIPPED_KEY"
            exit 1
          fi
      - name: Delete this run's caches
        if: always()
        run: |
          for key in "$SAVED_KEY" "$SKIPPED_KEY"; do
            gh cache delete "$key" 2>/dev/null || true
          done
